version: 2

models:
  - name: mart_malawi_requisition_by_region
    description: >
      Malawi requisitions, one row per requisition, extending the core
      mart_requisition_summary with the official Malawi region. Built on top of
      the core package's mart_requisition_summary and mart_facility_directory.
      It previously aggregated to region x program x status, which left the
      dashboard with no period and no district to filter on; Superset aggregates
      now, and the same rows serve the raw-data table.
    columns:
      - name: requisition_id
        description: Requisition UUID
        tests:
          - not_null
          - unique
      - name: geographic_zone_name
        description: District the requisition's facility belongs to
        tests:
          - not_null
      - name: period_name
        description: Processing period the requisition was raised for
        tests:
          - not_null
      - name: emergency
        description: True when the requisition was raised outside the reporting schedule
        tests:
          - not_null
      - name: region
        description: Geographic region (parent zone or zone if no parent)
        tests:
          - not_null
      - name: official_region
        description: >
          Standardised official region (Northern, Central, Southern) mapped
          from the directional source region via the region_crosswalk seed.
          'Unmapped' is the sentinel for a source region absent from the
          crosswalk (expected on non-Malawi demo geography; should be 0 on
          real Malawi data).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Northern
                  - Central
                  - Southern
                  - Unmapped
      - name: program_name
        description: Program name
        tests:
          - not_null
      - name: status
        description: Requisition workflow status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - INITIATED
                  - SUBMITTED
                  - AUTHORIZED
                  - IN_APPROVAL
                  - APPROVED
                  - RELEASED
                  - RELEASED_WITHOUT_ORDER
                  - SKIPPED
                  - REJECTED

  - name: mart_malawi_stock_status
    description: >
      Malawi stock status: core stock status data enriched with Malawi
      specifics. program_name comes straight from the core mart and is the
      requisition's own program (live program data - requisition templates
      derive from referencedata.program_orderables); is_tracer flags the
      client-curated HSSP tracer product list from the malawi_tracer_products
      seed.
    columns:
      - name: line_item_id
        description: Requisition line item UUID
        tests:
          - not_null
          - unique
      - name: program_name
        description: "Health program the line item was requisitioned under (live OpenLMIS program name, e.g. Malaria, HIV, TB)"
        tests:
          - not_null
      - name: is_tracer
        description: "1 when the product is on the client-curated HSSP tracer list (malawi_tracer_products seed)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: official_region
        description: >
          Standardised official region (Northern, Central, Southern) mapped
          from parent_zone_name via the region_crosswalk seed. 'Unmapped' is
          the sentinel for a region absent from the crosswalk (should be 0 on
          real Malawi data).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Northern
                  - Central
                  - Southern
                  - Unmapped
      - name: district_iso
        description: "ISO 3166-2 district code (MW-XX) from the malawi_district_iso seed; Superset Country Map join key. Empty string when the facility's district is not in the seed."
      - name: district_name
        description: "Canonical district label for district_iso, one name per code. The seed carries spelling aliases (Mzimba, Mzimba North and Mzimba South all resolve to MW-MZ), so grouping a chart on the raw zone_name would split one map polygon into several bars; this column keeps a district chart one-to-one with the map."
      - name: stock_status
        tests:
          - not_null
      - name: combined_stockout
        tests:
          - not_null
      - name: schedule_type
        description: "Reporting frequency (Weekly / Monthly / Quarterly / BUQ), inherited from the core mart_stock_status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Weekly
                  - Monthly
                  - Quarterly
                  - BUQ
      - name: in_latest_month
        description: >
          1 for rows in the most recent COMPLETE reporting month (see the
          core mart_month_completeness; the newest month present in the data
          is structurally partial). The latest-month snapshot charts
          (district map, inventory snapshot) filter on this flag instead of
          a now-relative window, which goes blank whenever reporting lags.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: in_complete_month
        description: >
          1 when the row's month reached the completeness threshold; trend
          charts hide ragged trailing months through this flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_malawi_reporting_status
    description: >
      Wrapper over the core mart_reporting_status with official_region.
      Backs the Malawi Reporting Summary dashboard.
    columns:
      - name: schedule_type
        description: "Reporting frequency (Weekly / Monthly / Quarterly / BUQ), inherited from the core mart_reporting_status; target of the dashboard's Schedule Type filter."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Weekly
                  - Monthly
                  - Quarterly
                  - BUQ

  - name: mart_malawi_stock_full
    description: >
      Unfiltered wrapper over the core mart_stock_status with official_region
      and the in_latest_month snapshot flag. Shared by the Malawi Orders and
      Malawi Consumption dashboards.
    columns:
      - name: in_latest_month
        description: >
          1 for rows in the most recent COMPLETE reporting month (see the
          core mart_month_completeness). The latest-month snapshot charts
          (order timeliness, most consumed products) filter on this flag
          instead of a now-relative window, which goes blank whenever
          reporting lags.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: in_complete_month
        description: >
          1 when the row's month reached the completeness threshold; trend
          charts hide ragged trailing months through this flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
