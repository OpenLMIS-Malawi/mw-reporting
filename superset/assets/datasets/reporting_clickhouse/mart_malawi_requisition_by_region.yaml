    verbose_name: Requisition type
    is_dttm: false
    is_active: true
    type: String
    groupby: true
    filterable: true
    expression: "CASE WHEN emergency THEN 'Emergency' ELSE 'Regular' END"
    description: "Regular or emergency, read off the emergency flag. Regular requisitions follow the reporting schedule; emergency ones are raised outside it."
metrics:
  - metric_name: latest_period_end
    verbose_name: "Latest Period End"
    metric_type: null
    expression: "MAX(period_end_date)"
    description: "Most recent period end date; used by the dashboard Period filter to sort its values chronologically."
    d3format: null
    extra: null
    warning_text: null
  - metric_name: total_requisitions
    verbose_name: Requisitions
    metric_type: null
    expression: "COUNT(DISTINCT requisition_id)"
    description: "Distinct requisitions. One row is one requisition, so this is also the row count, but stated as distinct so a future join cannot inflate it."
    d3format: ",.0f"
    extra: null
    warning_text: null
  - metric_name: emergency_requisitions
    verbose_name: Emergency Requisitions
    metric_type: null
    expression: "COUNT(DISTINCT if(emergency, requisition_id, null))"
    description: "Distinct requisitions raised outside the reporting schedule."
    d3format: ",.0f"
    extra: null
    warning_text: null
