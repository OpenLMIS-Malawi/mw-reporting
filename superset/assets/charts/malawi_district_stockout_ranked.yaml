slice_name: "Malawi: District Stock-Out Rate (Ranked)"
viz_type: echarts_timeseries_bar
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000037"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "Districts ranked by stock-out rate, and the map's legend: the value printed on each bar is the number behind the district's colour. The rate is the share of reported product lines that were stocked out. Grouped on district_name rather than the raw zone name, so the bars stay one-to-one with the map polygons; the seed's spelling aliases (Mzimba North, Mzimba South) would otherwise split MW-MZ into two bars. Obeys the dashboard filter bar, Period included."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  orientation: horizontal
  x_axis: district_name
  groupby: []
  metrics:
    - stockout_rate
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: "=="
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  x_axis_sort: stockout_rate
  x_axis_sort_asc: true
  order_desc: true
  row_limit: 50
  color_scheme: supersetColors
  show_legend: false
  y_axis_title: Stock-Out Rate
  y_axis_title_margin: 30
  y_axis_format: ".1%"
  y_axis_bounds: [null, 1]
  truncateYAxis: false
  rich_tooltip: true
  showTooltipTotal: false
  show_value: true
  zoomable: false
query_context: null
