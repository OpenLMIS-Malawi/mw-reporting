slice_name: "Malawi: Consumption — Previous 12 Months"
viz_type: echarts_timeseries_line
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000113"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000100"
description: "Consumption per district over the 12 months ending one year ago (i.e. months 13–24 back). Pair with the 'Current 12 Months' chart for year-over-year comparison."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "SUM(total_consumed_quantity)"
      label: "Consumption"
  groupby:
    - zone_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "period_end_date >= toStartOfMonth(today()) - INTERVAL 24 MONTH AND period_end_date < toStartOfMonth(today()) - INTERVAL 12 MONTH"
      subject: period_end_date
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 50000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 30
  y_axis_title: Consumption
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ",.0f"
  rich_tooltip: true
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: false
  markerSize: 6
  zoomable: true
query_context: null
