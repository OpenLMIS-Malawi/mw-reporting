      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-on-time-through
      name: Earlier cut-off day
      filterType: filter_select
      targets:
        - column:
            name: on_time_through_day
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000060"
      scope:
        rootPath:
          - ROOT_ID
        excluded:
          - 8901
          - 8903
          - 8904
          - 8905
          - 8906
          - 8907
          - 8908
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: false
        searchAllOptions: false
        inverseSelection: false
        sortAscending: true
        sortMetric: submission_day
      adhoc_filters:
        - clause: WHERE
          expressionType: SQL
          sqlExpression: "submitted_date IS NOT NULL"
          subject: submitted_date
      type: NATIVE_FILTER
      description: "The lower of the two cut-off days, whichever of the two filters it is entered in. Reports submitted on or before it read as on time. With both filters left empty the days are the 10th and the 15th. The bucket labels on the chart always carry the days that actually applied."
      cascadeParentIds: []
      defaultDataMask:
        extraFormData: {}
        filterState:
          value:
            - 10
        ownState: {}
    - id: NATIVE_FILTER-late-through
      name: Later cut-off day
      filterType: filter_select
      targets:
        - column:
            name: late_through_day
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000060"
      scope:
        rootPath:
          - ROOT_ID
        excluded:
          - 8901
          - 8903
          - 8904
          - 8905
          - 8906
          - 8907
          - 8908
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: false
        searchAllOptions: false
        inverseSelection: false
        sortAscending: true
        sortMetric: submission_day
      adhoc_filters:
        - clause: WHERE
          expressionType: SQL
          sqlExpression: "submitted_date IS NOT NULL"
          subject: submitted_date
      type: NATIVE_FILTER
      description: "The higher of the two cut-off days, whichever of the two filters it is entered in. Reports after the earlier day and on or before this one read as late, and anything after it reads as extreme late. With both filters left empty the days are the 10th and the 15th. The bucket labels on the chart always carry the days that actually applied."
      cascadeParentIds: []
      defaultDataMask:
        extraFormData: {}
        filterState:
          value:
            - 15
        ownState: {}
