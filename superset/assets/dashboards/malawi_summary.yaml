dashboard_title: "Malawi Summary"
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000030"
version: "1.0.0"
description: "Executive summary for Malawi tracer products: district stockout map, programmatic stockout pivot, multi-program stockout trend, top stocked-out products, and current inventory snapshot per program."
slug: malawi-summary
css: |
  /* Country Map: thicker, high-contrast district borders. The plugin draws
     path.region with vector-effect: non-scaling-stroke and exposes no border
     control, so the dashboard stylesheet is the supported place for this. */
  .superset-legacy-chart-country-map path.region {
    /* the plugin ships its own near-invisible stroke colour; the dashboard
       stylesheet loads earlier, so the colour needs the bump */
    stroke: #ffffff !important;
    stroke-width: 1.6px;
  }
  /* A district the current filters return no rows for is absent from the
     result, and the plugin paints an unmatched region with fill: none. On a
     white card that reads as the district having been removed rather than
     having no data, and the white stroke above hides it completely. Grey it
     instead. Both spellings are matched because the browser decides how it
     serialises the inline style the plugin writes.
     Do NOT solve this by filling absent districts with 0 instead: on a
     green-to-red scale a 0 paints them as the best performers, and getting
     there costs the Period filter, which is why the pre-aggregated district
     mart was dropped. That trade has been reversed three times already.
     This rule goes once the deployed Superset greys unmatched regions
     itself. It only applies on the dashboard, so the chart opened standalone
     in Explore still shows the gaps as white. */
  .superset-legacy-chart-country-map path.region[style*="fill: none"],
  .superset-legacy-chart-country-map path.region[style*="fill:none"] {
    fill: #d9d9d9 !important;
  }
published: true
certified_by: null
certification_details: null
is_managed_externally: false
metadata:
  timed_refresh_immune_slices: []
  expanded_slices: {}
  refresh_frequency: 0
  default_filters: "{}"
  color_scheme: null
  label_colors: {}
  color_scheme_domain: []
  shared_label_colors: []
  cross_filters_enabled: true
  filter_bar_orientation: HORIZONTAL
  native_filter_configuration:
    - id: NATIVE_FILTER-program
      name: Program
      filterType: filter_select
      targets:
        - column:
            name: program_name
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
      scope:
        rootPath:
          - ROOT_ID
        # 9003, 9004 and 9005 are the three tracer-scoped charts. The tracer
        # list is a curated set of products that only ever appear on Essential
        # Meds requisitions, so intersecting it with any other programme is
        # empty by construction and the charts render "No results were
        # returned for this query". Leaving them in scope makes a structural
        # emptiness look like a broken chart. They keep every other filter,
        # because tracer products do span regions, districts and facilities.
        excluded:
          - 9003
          - 9004
          - 9005
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds: []
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-region
      name: Region
      filterType: filter_select
      targets:
        - column:
            name: official_region
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds: []
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-district
      name: District
      filterType: filter_select
      targets:
        - column:
            # district_name so the dropdown offers the same 28 districts the map
            # draws. On zone_name it offered 29, listing Mzimba North and Mzimba
            # South next to a chart that now draws one bar called Mzimba.
            name: district_name
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds:
        - NATIVE_FILTER-program
        - NATIVE_FILTER-region
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-schedule-type
      name: Schedule Type
      filterType: filter_select
      targets:
        - column:
            name: schedule_type
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
      scope:
        rootPath:
          - ROOT_ID
        # Same three tracer charts as the Program filter above, for the same
        # reason one step removed: measured on dev, every tracer line is
        # Essential Meds on a Monthly schedule (17 products, 330,388 lines and
        # no other combination), so this filter selects Program by proxy and
        # picking Weekly, Quarterly or BUQ blanks the three charts exactly as
        # picking another programme did.
        excluded:
          - 9003
          - 9004
          - 9005
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      type: NATIVE_FILTER
      description: "Filter by program reporting frequency (Weekly / Monthly / Quarterly / BUQ)."
      cascadeParentIds:
        - NATIVE_FILTER-program
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-period
      name: Period
      filterType: filter_select
      targets:
        - column:
            name: period_name
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
      scope:
        rootPath:
          - ROOT_ID
        excluded: 
          - 9006
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
        sortAscending: false
        sortMetric: latest_period_end
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds:
        - NATIVE_FILTER-program
        - NATIVE_FILTER-schedule-type
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-facility
      name: Facility
      filterType: filter_select
      targets:
        - column:
            name: facility_name
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: true
        inverseSelection: false
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds:
        - NATIVE_FILTER-program
        - NATIVE_FILTER-region
        - NATIVE_FILTER-district
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
