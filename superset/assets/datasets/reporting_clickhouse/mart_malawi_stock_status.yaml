    verbose_name: District
    is_dttm: false
    is_active: true
    type: String
    groupby: true
    filterable: true
    expression: null
    description: "Canonical district label, one name per district_iso. Grouping on this instead of zone_name keeps a district chart one-to-one with the Country Map: the seed's spelling aliases (Mzimba / Mzimba North / Mzimba South) all resolve to MW-MZ, and zone_name would split that single polygon into two bars."
