description: "Executive summary for Malawi tracer products: district stockout map, programmatic stockout pivot, multi-program stockout trend, top stocked-out products, and current inventory snapshot per program."
slug: malawi-summary
css: |
  /* Country Map: thicker, high-contrast district borders. The plugin draws
     path.region with vector-effect: non-scaling-stroke and exposes no border
     control, so the dashboard stylesheet is the supported place for this. */
  .superset-legacy-chart-country-map path.region {
    /* the plugin ships its own near-invisible stroke colour; the dashboard
       stylesheet loads earlier, so the colour needs the bump */
    stroke: #ffffff !important;
    stroke-width: 1.6px;
  }
