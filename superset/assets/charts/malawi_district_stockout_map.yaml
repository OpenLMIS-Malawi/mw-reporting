description: "Stock-out rate per district across Malawi tracer products in the most recent reporting month present in the data, shown on a map of Malawi. Colour = actual stock-out % (green = low, red = high). Districts without data are shown as 0% (deepest green) by product decision; their zero comes from coalesce around the average, so districts that do have data keep their true mean. The ranked chart beside it doubles as the legend."
