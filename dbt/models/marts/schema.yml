version: 2

models:
  - name: mart_malawi_requisition_by_region
    description: >
      Malawi regional requisition summary: requisition counts aggregated
      by geographic region, program, and status. Extension mart built on
      top of the core package's mart_requisition_summary and mart_facility_directory.
    columns:
      - name: region
        description: Geographic region (parent zone or zone if no parent)
        tests:
          - not_null
      - name: official_region
        description: >
          Standardised official region (Northern, Central, Southern) mapped
          from the directional source region via the region_crosswalk seed.
          'Unmapped' is the sentinel for a source region absent from the
          crosswalk (expected on non-Malawi demo geography; should be 0 on
          real Malawi data).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Northern
                  - Central
                  - Southern
                  - Unmapped
      - name: program_name
        description: Program name
        tests:
          - not_null
      - name: status
        description: Requisition workflow status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - INITIATED
                  - SUBMITTED
                  - AUTHORIZED
                  - IN_APPROVAL
                  - APPROVED
                  - RELEASED
                  - RELEASED_WITHOUT_ORDER
                  - SKIPPED
                  - REJECTED
      - name: requisition_count
        description: Number of requisitions
        tests:
          - not_null

  - name: mart_malawi_stock_status
    description: >
      Malawi stock status: core stock status data enriched with Malawi
      specifics. malawi_program is the requisition's own program (live
      program data - requisition templates derive from
      referencedata.program_orderables); is_tracer flags the client-curated
      HSSP tracer product list from the malawi_tracer_products seed.
    columns:
      - name: line_item_id
        description: Requisition line item UUID
        tests:
          - not_null
          - unique
      - name: malawi_program
        description: "Health program the line item was requisitioned under (live OpenLMIS program name, e.g. Malaria, HIV, TB)"
        tests:
          - not_null
      - name: is_tracer
        description: "1 when the product is on the client-curated HSSP tracer list (malawi_tracer_products seed)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: official_region
        description: >
          Standardised official region (Northern, Central, Southern) mapped
          from parent_zone_name via the region_crosswalk seed. 'Unmapped' is
          the sentinel for a region absent from the crosswalk (should be 0 on
          real Malawi data).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Northern
                  - Central
                  - Southern
                  - Unmapped
      - name: district_iso
        description: "ISO 3166-2 district code (MW-XX) from the malawi_district_iso seed; Superset Country Map join key. Empty string when the facility's district is not in the seed."
      - name: stock_status
        tests:
          - not_null
      - name: combined_stockout
        tests:
          - not_null
      - name: schedule_type
        description: "Reporting frequency (Weekly / Monthly / Quarterly / BUQ), inherited from the core mart_stock_status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Weekly
                  - Monthly
                  - Quarterly
                  - BUQ
      - name: in_latest_month
        description: >
          1 for rows in the most recent COMPLETE reporting month (see the
          core mart_month_completeness; the newest month present in the data
          is structurally partial). The latest-month snapshot charts
          (district map, inventory snapshot) filter on this flag instead of
          a now-relative window, which goes blank whenever reporting lags.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: in_complete_month
        description: >
          1 when the row's month reached the completeness threshold; trend
          charts hide ragged trailing months through this flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_malawi_reporting_status
    description: >
      Wrapper over the core mart_reporting_status with official_region.
      Backs the Malawi Reporting Summary dashboard.
    columns:
      - name: schedule_type
        description: "Reporting frequency (Weekly / Monthly / Quarterly / BUQ), inherited from the core mart_reporting_status; target of the dashboard's Schedule Type filter."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Weekly
                  - Monthly
                  - Quarterly
                  - BUQ

  - name: mart_malawi_stock_full
    description: >
      Unfiltered wrapper over the core mart_stock_status with official_region
      and the in_latest_month snapshot flag. Shared by the Malawi Orders and
      Malawi Consumption dashboards.
    columns:
      - name: in_latest_month
        description: >
          1 for rows in the most recent COMPLETE reporting month (see the
          core mart_month_completeness). The latest-month snapshot charts
          (order timeliness, most consumed products) filter on this flag
          instead of a now-relative window, which goes blank whenever
          reporting lags.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: in_complete_month
        description: >
          1 when the row's month reached the completeness threshold; trend
          charts hide ragged trailing months through this flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_malawi_district_stockout
    description: >
      District x program latest-month stock-out snapshot, zero-filled from the
      malawi_district_iso seed so every district has a row per program. Backs
      the Malawi Summary district map and its ranked companion chart.
      stockout_rate is NULL (not 0) where a district has no data.
    columns:
      - name: district_iso
        tests:
          - not_null
      - name: program_name
        tests:
          - not_null
