slice_name: "Malawi: Stockout Rate by Product (12 with the most stocked-out lines)"
viz_type: echarts_timeseries_line
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000022"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "Stockout rate over time for the twelve products with the most stocked-out line items in the current filter selection. The ranking is recomputed whenever a filter changes, so the twelve shown are the worst within whatever Program, Region, District or Facility is selected. Use the Product filter to follow a specific product instead."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "AVG(combined_stockout)"
      label: "Stockout Rate"
  groupby:
    - product_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  # Cap the number of series, not the number of rows. Without series_limit the
  # only bound is row_limit, which is a LIMIT on the flat product x month
  # result: 2,564 products over ~37 months is about 52,800 rows against a limit
  # of 1,000, and with order_desc the thousand kept were drawn from the 1,617
  # rows sitting at exactly 1.0. Every series then rendered pinned at 100%
  # against a true overall rate of 0.53. Verified on the deployed instance: with
  # these two keys the query gains an inner top-N subquery and returns 432 rows.
  #
  # Rank by stockout_count (SUM) and not by stockout_rate (AVG): 27 products sit
  # at exactly 1.0 and 22 of those have fewer than 50 observations, so ranking by
  # rate rebuilds the same flat-100% chart through a different route.
  series_limit: 12
  series_limit_metric: stockout_count
  # Headroom so the row limit can never select which rows come back again.
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Stockout Rate
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".0%"
  y_axis_bounds: [null, 1]
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
