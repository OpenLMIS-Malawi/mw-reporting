slice_name: "Reporting Timeliness By Week"
viz_type: echarts_timeseries_bar
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000121"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000060"
description: "Distribution of submitted reports across week 1-5 of the calendar month, per month. Helps spot whether reporters submit early or late in the month. Region is the official Malawi region."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SIMPLE
      column:
        column_name: facility_id
        type: String
      aggregate: COUNT
      label: "Reports"
  groupby:
    - submitted_week_of_month
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "reporting_status = 'Reported'"
      subject: reporting_status
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: false
  sort_series_type: name
  sort_series_ascending: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Submitted Reports
  y_axis_title_margin: 60
  y_axis_format: ",.0f"
  stack: stack
  rich_tooltip: true
  tooltipTimeFormat: "%b %Y"
  show_value: false
  zoomable: false
query_context: null
