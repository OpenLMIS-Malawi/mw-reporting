version: "1.0.0"
description: "Malawi executive reporting summary: reporting rate by program, timeliness, indicator pivot, annual rates, and the three-year national trend — filterable by the three official Malawi regions."
slug: malawi-reporting-summary
css: ""
published: true
certified_by: null
certification_details: null
is_managed_externally: false
metadata:
  timed_refresh_immune_slices: []
  expanded_slices: {}
  refresh_frequency: 0
  default_filters: "{}"
  # supersetColorsOutcome is supersetColors with the 3rd and 4th slots swapped, so the
  # Skipped series on Reporting Rate by Program lands on orange instead of green - a
  # deliberate skip is neutral, and green beside Reported reads as a second good
  # outcome. Set on the dashboard because a dashboard scheme overrides its charts'.
  color_scheme: supersetColorsOutcome
  # label_colors stays empty on purpose: Superset 6.1 recomputes it on first render and
  # writes {} straight back over an imported map, so the outcome colours cannot be pinned
  # from YAML. Skipped therefore takes palette index 2 (green), the same slot the
  # Timeliness chart beside it gives its own third series.
  label_colors: {}
  color_scheme_domain: []
  shared_label_colors: []
  cross_filters_enabled: true
  filter_bar_orientation: HORIZONTAL
  native_filter_configuration:
