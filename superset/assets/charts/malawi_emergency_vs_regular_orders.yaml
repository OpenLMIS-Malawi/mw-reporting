slice_name: "Malawi: Emergency vs Regular Orders"
viz_type: pie
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000082"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000080"
description: "Distinct requisition count split between emergency and regular orders. Scoped to released orders (requisition_status = 'RELEASED'), i.e. requisitions converted to an actual order."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: pie
  groupby:
    - order_type
  metric:
    expressionType: SIMPLE
    column:
      column_name: requisition_id
      type: String
    aggregate: COUNT_DISTINCT
    label: "Requisitions"
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "requisition_status = 'RELEASED'"
      subject: requisition_status
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  sort_by_metric: true
  color_scheme: supersetColors
  show_labels: true
  show_legend: true
  legendType: scroll
  legendOrientation: top
  label_type: key_value_percent
  number_format: ",.0f"
  date_format: smart_date
  show_labels_threshold: 5
  outerRadius: 70
  innerRadius: 30
query_context: null
