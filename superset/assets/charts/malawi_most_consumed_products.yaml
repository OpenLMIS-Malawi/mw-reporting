slice_name: "Malawi: Most Consumed Products"
viz_type: table
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000114"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000100"
description: "Products ranked by total adjusted consumption. The dashboard Period filter sets the range; with nothing selected it covers the three years the mart retains. Months whose data is still arriving are excluded."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: table
  groupby:
    - product_name
    - product_code
  metrics:
    - expressionType: SQL
      sqlExpression: "SUM(adjusted_consumption)"
      label: "Adjusted Consumption"
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_by_cols: []
  server_pagination: false
  order_desc: true
  show_cell_bars: true
  color_pn: false
  table_timestamp_format: smart_date
  page_length: 10
  include_search: true
  column_config:
    Adjusted Consumption:
      d3NumberFormat: ",.0f"
query_context: null
