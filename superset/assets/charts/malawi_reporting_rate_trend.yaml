slice_name: "Malawi: Reporting Rate Trend"
viz_type: echarts_timeseries_line
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000062"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000060"
description: "Share of facility reporting obligations fulfilled per month, one line per program - the same view as the core Reporting Rate Trend. Replaces the former Reported/Did-not-report pie, which showed a single static share that was hard to relate to facility counts."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    # the saved reporting_rate metric, not a copy of its SQL: the skip policy lives in
    # exactly one place per dataset, so swapping it later moves every chart at once
    - reporting_rate
  groupby:
    - program_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Reporting Rate
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".0%"
  y_axis_bounds: [null, 1]
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
