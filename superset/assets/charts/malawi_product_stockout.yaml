slice_name: "Malawi: Tracer Product Stockouts"
viz_type: table
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000034"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "Tracer products with the most line-item stockouts. Each row counts how many requisition line items had stock_on_hand = 0."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: table
  query_mode: aggregate
  groupby:
    - product_name
  metrics:
    - stockout_line_count
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: is_tracer
      comparator: 1
  row_limit: 10000
  order_by_cols:
    - '["stockout_line_count", false]'
  server_pagination: true
  server_page_length: 25
  show_cell_bars: true
  color_pn: false
  table_timestamp_format: smart_date
  page_length: 25
  include_search: true
  header_font_size: 0.6
  cell_font_size: 0.6
  column_config:
    product_name:
      customColumnName: "Product"
    stockout_line_count:
      customColumnName: "Stocked Out Lines"
      d3NumberFormat: ",.0f"
query_context: null
