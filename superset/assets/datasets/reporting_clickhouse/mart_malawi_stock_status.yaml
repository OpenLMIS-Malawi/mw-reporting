    filterable: true
    expression: null
    description: "1 for rows in the most recent COMPLETE reporting month; the latest-month snapshot charts filter on it instead of a now-relative window, which goes blank whenever reporting lags."
  - column_name: in_complete_month
    verbose_name: In Complete Month
    is_dttm: false
    is_active: true
