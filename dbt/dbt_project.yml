name: olmis_analytics_malawi
version: '1.0.0'
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

seeds:
  olmis_analytics_malawi:
    +schema: curated

models:
  olmis_analytics_malawi:
    marts:
      +materialized: table
      +schema: curated

vars:
  # MW-1482: Malawi programme categories to hide from reporting. These are
  # product-form buckets, not health programmes (Misho's locked Q3 answer).
  # Excluded in mart_malawi_stock_status via `where malawi_program not in (...)`
  # so every downstream Malawi chart inherits the hide. NOTE: IMCI is DENIED;
  # Injections is KEPT. The mart also hardcodes this list as a var() default,
  # so the behaviour holds even if this block is not resolved.
  denied_programs:
    - IMCI
    - HSSP Tracer Items
    - Tablets/Capsules
    - Health Supplies
