slice_name: "Months of Stock Over Time"
viz_type: echarts_timeseries_line
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000136"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "Median months of stock per zone over time; Mzimba North and Mzimba South appear as separate zones. months_of_stock is computed as round(stock_on_hand / average_consumption, 1) per line item, and the chart takes the median across the line items in each zone per period. A median rather than an average because the average is dominated by a handful of lines with very large stock against tiny consumption. Only line items that have consumption can be rated at all, so this describes the products that move rather than the whole catalogue: a zone can read a healthy figure here while most of its lines are stocked out, and the Stockout Rate chart is the one that counts those. Bucketed by month so the axis shows the periods actually selected. Where monthly and quarterly reporters are mixed, a quarterly reporter leaves holes in two months out of three; use the Time Grain filter to switch to quarter if that applies."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "median(months_of_stock)"
      label: "Median months, lines with consumption"
  groupby:
    - zone_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: "Median months of stock"
  y_axis_title_margin: 40
  y_axis_format: ".1f"
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: smart_date
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
