slice_name: "Malawi: Stockout Rate by District"
viz_type: echarts_timeseries_line
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000024"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "Stockout rate trends over time per district. Use the Program filter to see per-district stockout for a specific program (replaces the legacy per-program District Stockout Rates charts)."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "AVG(combined_stockout)"
      label: "Stockout Rate"
  # district_name, not zone_name: the reference data holds Mzimba as two zones
  # (North and South), so grouping on the raw zone drew 29 lines against the
  # 28 polygons the country map keys off district_iso, and split Mzimba's
  # numbers in half. Measured on dev: North 0.4392 over 446,436 lines, South
  # 0.5889 over 357,545, merging to 0.5058 over 803,981. That merged figure is
  # a re-aggregation over all the lines, not the mean of the two.
  groupby:
    - district_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  # Districts times months, so the result sits just over a thousand rows and the
  # old limit of 1,000 was cutting it: measured 1,044 rows on dev against the
  # limit, and with order_desc the rows dropped were the lowest rates, so the
  # chart quietly hid its best-performing district-months. Ten thousand leaves
  # room for the window to widen without this recurring.
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Stockout Rate
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".0%"
  y_axis_bounds: [null, 1]
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
