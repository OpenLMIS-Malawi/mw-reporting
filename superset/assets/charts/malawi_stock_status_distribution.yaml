slice_name: "Malawi: Stock Status Distribution Over Time"
viz_type: echarts_timeseries_bar
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000025"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "How many facilities sit in each stock status, per period. A facility is counted once per status it holds at least one product line in, so the stacked total runs about five times the number of reporting facilities: 898 facilities gave a stack of 4,496 in October 2025. Read the segments, not the total. There is no per-programme breakdown in the chart itself; use the Program filter above for that. Unknown is a quarter of all product lines and means months-of-stock could not be computed: three quarters of those have no stock on hand recorded at all, the rest have stock but no usable consumption to divide by."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SIMPLE
      column:
        column_name: facility_id
        type: String
      aggregate: COUNT_DISTINCT
      label: "Facilities in this status"
  groupby:
    - stock_status
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "stock_status IS NOT NULL"
      subject: stock_status
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: "Facilities per status"
  y_axis_title_margin: 60
  y_axis_format: ",.0f"
  stack: stack
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  zoomable: false
query_context: null
