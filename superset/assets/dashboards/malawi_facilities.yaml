  refresh_frequency: 0
  default_filters: "{}"
  color_scheme: supersetColors
  label_colors: {}
  color_scheme_domain: []
  shared_label_colors: []
  cross_filters_enabled: true
  filter_bar_orientation: HORIZONTAL
  native_filter_configuration:
    - id: NATIVE_FILTER-region
      name: Region
      filterType: filter_select
      targets:
        - column:
            name: official_region
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000040"
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      # Pre-filter for the dropdown only. Superset applies a native filter's own
      # adhoc_filters to the query that builds its OPTION LIST, never to the
      # charts, so nothing is hidden from the data: a disabled facility still
      # appears in any chart that legitimately counts it. Two records are the
      # reason this is here. NS121 Kalimanjira Health Centre and a system record
      # coded "program" named "Programs" are both disabled and both attached to
      # the country-level zone "Malawi" instead of a district, which is what put
      # "Unmapped" in the Region list and "Malawi" in the District list.
      # TO BRING DISABLED FACILITIES BACK: delete this comment and the five
      # adhoc_filters lines below it. There are three identical copies in this
      # file, one each in NATIVE_FILTER-region, NATIVE_FILTER-district and
      # NATIVE_FILTER-type. Removing one only affects that dropdown. Nothing
      # outside this file is involved: no dbt model, no dataset, no other
      # dashboard.
      adhoc_filters:
        - clause: WHERE
          expressionType: SQL
          sqlExpression: "facility_enabled = true"
          subject: facility_enabled
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds: []
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-district
      name: District
      filterType: filter_select
      targets:
        - column:
            name: geographic_zone_name
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000040"
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      # Pre-filter for the dropdown only. Superset applies a native filter's own
      # adhoc_filters to the query that builds its OPTION LIST, never to the
      # charts, so nothing is hidden from the data: a disabled facility still
      # appears in any chart that legitimately counts it. Two records are the
      # reason this is here. NS121 Kalimanjira Health Centre and a system record
      # coded "program" named "Programs" are both disabled and both attached to
      # the country-level zone "Malawi" instead of a district, which is what put
      # "Unmapped" in the Region list and "Malawi" in the District list.
      # TO BRING DISABLED FACILITIES BACK: delete this comment and the five
      # adhoc_filters lines below it. There are three identical copies in this
      # file, one each in NATIVE_FILTER-region, NATIVE_FILTER-district and
      # NATIVE_FILTER-type. Removing one only affects that dropdown. Nothing
      # outside this file is involved: no dbt model, no dataset, no other
      # dashboard.
      adhoc_filters:
        - clause: WHERE
          expressionType: SQL
          sqlExpression: "facility_enabled = true"
          subject: facility_enabled
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds:
        - NATIVE_FILTER-region
      defaultDataMask:
        extraFormData: {}
        filterState:
          value: null
        ownState: {}
    - id: NATIVE_FILTER-type
      name: Type
      filterType: filter_select
      targets:
        - column:
            name: facility_type_name
          datasetUuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000040"
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: false
        inverseSelection: false
      # Pre-filter for the dropdown only. Superset applies a native filter's own
      # adhoc_filters to the query that builds its OPTION LIST, never to the
      # charts, so nothing is hidden from the data: a disabled facility still
      # appears in any chart that legitimately counts it. Two records are the
      # reason this is here. NS121 Kalimanjira Health Centre and a system record
      # coded "program" named "Programs" are both disabled and both attached to
      # the country-level zone "Malawi" instead of a district, which is what put
      # "Unmapped" in the Region list and "Malawi" in the District list.
      # TO BRING DISABLED FACILITIES BACK: delete this comment and the five
      # adhoc_filters lines below it. There are three identical copies in this
      # file, one each in NATIVE_FILTER-region, NATIVE_FILTER-district and
      # NATIVE_FILTER-type. Removing one only affects that dropdown. Nothing
      # outside this file is involved: no dbt model, no dataset, no other
      # dashboard.
      adhoc_filters:
        - clause: WHERE
          expressionType: SQL
          sqlExpression: "facility_enabled = true"
          subject: facility_enabled
      type: NATIVE_FILTER
      description: ""
      cascadeParentIds:
        - NATIVE_FILTER-region
        - NATIVE_FILTER-district
      defaultDataMask:
        extraFormData: {}
        filterState:
