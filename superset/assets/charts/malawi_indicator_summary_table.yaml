slice_name: "Malawi: Indicator Summary: Reporting Rate by Program"
viz_type: pivot_table_v2
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000066"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000060"
description: "Reporting rate per program × period. Rows = period, Columns = program."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: pivot_table_v2
  # Month rows as YYYY-MM strings: chronological order for free (period_name
  # sorted alphabetically) and weekly periods roll up into their month.
  # An SQL expression because pivot rows ignore the chart time grain.
  groupbyRows:
    - label: Month
      sqlExpression: "formatDateTime(toStartOfMonth(period_end_date), '%Y-%m')"
      expressionType: SQL
  groupbyColumns:
    - program_name
  metrics:
    - reporting_rate
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  aggregateFunction: Average
  rowOrder: key_a_to_z
  colOrder: key_a_to_z
  rowSubtotalPosition: false
  colSubtotalPosition: false
  rowTotals: false
  colTotals: false
  valueFormat: ".1%"
  metricsLayout: COLUMNS
  conditional_formatting: []
query_context: null
