slice_name: "Malawi: Program Current Inventory Snapshot"
viz_type: table
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000035"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000020"
description: "Latest-reporting-month snapshot of facility-level stock status per program. Each column is an independent indicator - the share of facilities with AT LEAST ONE product in that bucket - so a facility counts in every column it qualifies for and the columns do not sum to 100%."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: table
  query_mode: aggregate
  groupby:
    - program_name
  metrics:
    - pct_facilities_stocked_out
    - pct_facilities_understocked
    - pct_facilities_adequately_stocked
    - pct_facilities_overstocked
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_latest_month
      comparator: 1
  row_limit: 10000
  order_by_cols:
    - '["program_name", true]'
  server_pagination: false
  show_cell_bars: false
  color_pn: false
  table_timestamp_format: smart_date
  page_length: 25
  include_search: false
  header_font_size: 0.6
  cell_font_size: 0.6
  column_config:
    program_name:
      customColumnName: "Program"
query_context: null
