slice_name: "Malawi: Annual Reporting Rate by Program"
viz_type: echarts_timeseries_bar
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000067"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000060"
description: "Average reporting rate per program for each calendar year (rolling). Bars = program, series = year."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: program_name
  groupby:
    - period_year
  metrics:
    - reporting_rate
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 5 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  order_desc: false
  row_limit: 50000
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  xAxisLabelRotation: 45
  y_axis_title: Reporting Rate
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".1%"
  truncateYAxis: false
  rich_tooltip: true
  showTooltipTotal: false
  show_value: false
  zoomable: false
query_context: null
