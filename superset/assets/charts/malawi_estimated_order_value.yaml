slice_name: "Malawi: Estimated Order Value"
viz_type: echarts_timeseries_bar
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000084"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000080"
description: "Total order cost per district, summed over every requisition line in scope. It is a floor, not an exact total: about a fifth of ordered lines carry no price in the source, so they contribute nothing. Emergency requisitions are included — they never record a received quantity, which used to empty this chart entirely. Legacy chart was hardcoded to program_name = 'Essential Meds'; the migration drops that filter and exposes Program in the dashboard filter bar."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: zone_name
  groupby: []
  metrics:
    - expressionType: SQL
      sqlExpression: "SUM(total_cost)"
      label: "Total Order Cost"
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  order_desc: true
  row_limit: 10000
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: District
  x_axis_title_margin: 60
  xAxisLabelRotation: 45
  y_axis_title: Total Order Cost
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ",.0f"
  truncateYAxis: false
  rich_tooltip: true
  show_value: false
  zoomable: false
query_context: null
