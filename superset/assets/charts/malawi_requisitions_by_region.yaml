slice_name: "Malawi: Requisitions by Region"
viz_type: echarts_timeseries_bar
uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000011"
version: "1.0.0"
dataset_uuid: "e1f2a3b4-c5d6-4e7f-8a9b-000000000010"
description: "Requisitions per region, split by workflow status. Use the filters above to narrow by program, district or period; the raw-data table below carries the same figures broken down further, and reads the small statuses that are invisible here — AUTHORIZED alone is four fifths of the total."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: official_region
  metrics:
    - total_requisitions
  groupby:
    - status
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      subject: official_region
      operator: IN
      comparator:
        - Northern
        - Central
        - Southern
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
  row_limit: 100
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Region
  x_axis_title_margin: 30
  y_axis_title: Requisition Count
  y_axis_title_margin: 60
  y_axis_format: ",.0f"
  rich_tooltip: true
  show_value: true
query_context: null
